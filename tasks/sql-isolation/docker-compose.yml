services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: isolation
      MARIADB_USER: app
      MARIADB_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uapp -papp --silent"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql
      - ./:/work:ro

  runner:
    image: python:3.12-slim
    working_dir: /work
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: isolation
      DB_USER: app
      DB_PASSWORD: app
    volumes:
      - ./:/work
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "-lc", "pip install -r requirements.txt && python scripts/run_all.py"]

volumes:
  db_data:
